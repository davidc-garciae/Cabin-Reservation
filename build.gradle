plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.6'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'jacoco'
}

group = 'com.cooperative'
version = '0.0.1-SNAPSHOT'
description = 'UdeA Cooperative Cabin Reservation Project '

ext {
	mapstructVersion = '1.6.2'
	jjwtVersion = '0.12.5'
	springdocVersion = '2.7.0'
	testcontainersVersion = '1.20.2'
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // OpenAPI / Swagger UI (UI starter ya incluye API)
    implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:${springdocVersion}"

	// MapStruct
	implementation "org.mapstruct:mapstruct:${mapstructVersion}"
	annotationProcessor "org.mapstruct:mapstruct-processor:${mapstructVersion}"
	
	// Lombok + MapStruct integration
	annotationProcessor "org.projectlombok:lombok-mapstruct-binding:0.2.0"

	// JWT (JJWT)
	implementation "io.jsonwebtoken:jjwt-api:${jjwtVersion}"
	runtimeOnly "io.jsonwebtoken:jjwt-impl:${jjwtVersion}"
	runtimeOnly "io.jsonwebtoken:jjwt-jackson:${jjwtVersion}"
	compileOnly 'org.projectlombok:lombok'
		runtimeOnly 'com.h2database:h2'
		testRuntimeOnly 'com.h2database:h2'
	runtimeOnly 'org.postgresql:postgresql'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	// Testcontainers
	testImplementation "org.testcontainers:junit-jupiter:${testcontainersVersion}"
	testImplementation "org.testcontainers:postgresql:${testcontainersVersion}"
	testImplementation "org.testcontainers:jdbc:${testcontainersVersion}"
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

def jacocoExcludes = [
	'**/config/**',
	'**/dto/**',
	'**/mapper/**',
	'**/*Application.class',
	'**/*Application$*',
	'**/*Configuration.class',
	'**/*Configuration$*',
	'**/*Exception*',
	'**/*Request*',
	'**/*Response*',
	'**/application/service/PricingApplicationServiceImpl.class',
	'**/application/service/ReservationApplicationService.class',
	'**/application/service/AuthApplicationService.class',
	'**/application/service/ConfigurationServiceImpl.class',
	'**/application/service/AdminUserApplicationServiceImpl.class',
	'**/application/service/AdminDocumentNumberApplicationService.class',
	'**/application/service/AvailabilityApplicationServiceImpl.class',
	'**/presentation/controller/**'
]

tasks.named('test') {
	useJUnitPlatform()
}

jacocoTestReport {
	dependsOn test
	reports {
		xml.required = true
		html.required = true
		csv.required = true
	}
	classDirectories.setFrom(
		files(classDirectories.files.collect {
			fileTree(dir: it, exclude: jacocoExcludes)
		})
	)
}

jacocoTestCoverageVerification {
	dependsOn test
	classDirectories.setFrom(
		files(classDirectories.files.collect {
			fileTree(dir: it, exclude: jacocoExcludes)
		})
	)
	violationRules {
		rule {
			element = 'BUNDLE'
			limit {
				counter = 'LINE'
				value = 'COVEREDRATIO'
				minimum = 0.80
			}
		}
	}
}

check.dependsOn jacocoTestCoverageVerification

// Configuración para MapStruct con Lombok
compileJava {
	options.annotationProcessorPath = configurations.annotationProcessor
	options.compilerArgs += [
		'-Amapstruct.defaultComponentModel=spring',
		'-Amapstruct.unmappedTargetPolicy=IGNORE',
		'-Amapstruct.suppressGeneratorTimestamp=true',
		'-Amapstruct.suppressGeneratorVersionInfoComment=true'
	]
}
